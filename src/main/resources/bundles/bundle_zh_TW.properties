settingV2.overlayUI.pgmm-power-table.name = 電力顯示視窗

pgmm.section.basic = 基本
pgmm.section.integration = 整合
pgmm.section.alerts = 警報與標記
pgmm.section.advanced = 進階
pgmm.section.performance = 效能
pgmm.section.update = 更新

setting.pgmm-updatecheck.name = 檢查更新
setting.pgmm-updatecheck.description = 遊戲啟動時，檢查 GitHub 是否有較新的模組版本，並在可用時顯示提示。
setting.pgmm-updatecheck-dialog.name = 顯示更新對話框
setting.pgmm-updatecheck-dialog.description = 停用時只會顯示簡短提示，不會開啟對話框。
