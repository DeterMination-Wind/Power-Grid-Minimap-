pgmm.category = 電力網格小地圖

setting.pgmm-enabled.name = 啟用覆蓋層
setting.pgmm-enabled.description = 在小地圖上為每個電力網路著色，並在電網中心顯示其電力平衡。
setting.pgmm-gridalpha.name = 電網顏色透明度
setting.pgmm-gridalpha.description = 小地圖上電力網格著色的透明度（0-100%）。
setting.pgmm-showbalance.name = 顯示平衡文字
setting.pgmm-showbalance.description = 在小地圖／完整地圖上顯示電力平衡文字標記。
setting.pgmm-markerscale.name = 平衡文字大小
setting.pgmm-markerscale.description = 小地圖上電力平衡標記的字型大小（50-300%）。
setting.pgmm-markercolor.name = 平衡文字顏色
setting.pgmm-markercolor.description = 十六進位顏色，例如 ffffff 或 ff0000ff。
setting.pgmm-hudmarkerscale.name = HUD 文字縮放
setting.pgmm-hudmarkerscale.description = 平衡文字隨 HUD 小地圖大小縮放的程度（0% = 固定大小，100% = 隨小地圖縮放，>100% = 更強）。
setting.pgmm-mi2minimap.name = 繪製於 MI2U 小地圖
setting.pgmm-mi2minimap.description = 在 MI2U／MI2-Utilities 小地圖視窗繪製覆蓋層（僅在安裝 MI2U 模組時有效）。
setting.pgmm-claimdistance.name = 歸屬距離
setting.pgmm-claimdistance.description = 完整地圖上，此距離（格）內的非電力建築可合併至最近的電網。
setting.pgmm-splitalertthreshold.name = 分離警報閾值
setting.pgmm-splitalertthreshold.description = 僅當原始電網每秒電力輸入高於此值時，才監控分離警報。
setting.pgmm-splitalert-negative-threshold.name = 分離負值閾值
setting.pgmm-splitalert-negative-threshold.description = 僅當分離出的子電網維持在此電力平衡值（每秒）或以下時發出警報。最大值為 0。
setting.pgmm-splitalert.name = 分離警報
setting.pgmm-splitalert.description = 僅當大型電網分離、較小子電網低於負值閾值且狀態持續穩定時，顯示警報與重新連接標記。
setting.pgmm-splitwindow.name = 分離偵測時間窗
setting.pgmm-splitwindow.description = 在顯示警報前，必須持續低於分離負值閾值的秒數。
setting.pgmm-splitalert-multiplayer.name = 在多人遊戲中傳送分離警報
setting.pgmm-splitalert-multiplayer.description = 分離警報觸發時，在多人遊戲的隊伍聊天中傳送重新連接提示。
setting.pgmm-splitalert-multiplayer-interval.name = 多人分離警報間隔
setting.pgmm-splitalert-multiplayer-interval.description = 多人遊戲分離警報聊天訊息之間的最短間隔。
setting.pgmm-clustermarkerdistance.name = 群組標記距離
setting.pgmm-clustermarkerdistance.description = 以此間隙閾值（格）將電網分割為矩形。若矩形之間的間隙大於此值，會在每個矩形中心顯示電網平衡並以淡色填滿；否則只在整個電網中心顯示一個標記。設為 0 可一律分割。
setting.pgmm-markerstroke.name = 重新連接標記粗細
setting.pgmm-markerstroke.description = 小地圖／完整地圖上重新連接標記的線條寬度。
setting.pgmm-markerlinecolor.name = 重新連接標記顏色
setting.pgmm-markerlinecolor.description = 十六進位顏色，例如 ffa500 或 ffa500ff。
setting.pgmm-ignore-area.name = 忽略小型電網
setting.pgmm-ignore-area.description = 隱藏面積（發電機 + 用電器 + 電池，以格^2計）低於此值的電網。設為 0 可停用。
setting.pgmm-updatewait.name = 更新延遲
setting.pgmm-updatewait.description = 方塊變更後，重新掃描／重建前的延遲（秒）。放置方塊造成卡頓時可提高此值。

setting.pgmm.rescue.section = 電力救援顧問（開發中）
setting.pgmm-rescue.name = 顯示救援提示
setting.pgmm-rescue.description = 當電網持續為負時，標示可能讓部分電網持續運作的建議正電力孤島。此功能仍在開發中，尚不完整，不建議啟用。
setting.pgmm-rescue-aggressive.name = 積極救援模式
setting.pgmm-rescue-aggressive.description = 考慮僅有電池的暫時孤島並掃描更多候選連線（可能較雜亂）。
setting.pgmm-rescue-window.name = 電力不足持續時間
setting.pgmm-rescue-window.description = 僅當電網持續為負達此秒數時顯示救援提示。
setting.pgmm-rescue-clearwindow.name = 清除救援提示時間
setting.pgmm-rescue-clearwindow.description = 若電網持續為正達此秒數（最低平衡值 > 0），則清除救援提示。
setting.pgmm-rescue-topk.name = 提示數量
setting.pgmm-rescue-topk.description = 一次顯示多少救援建議。
setting.pgmm-rescue-stroke.name = 救援標記粗細
setting.pgmm-rescue-stroke.description = 小地圖／完整地圖上救援標記的線條寬度。
setting.pgmm-rescue-color.name = 救援標記顏色
setting.pgmm-rescue-color.description = 十六進位顏色，例如 ff3344 或 ff3344ff。

pgmm.toast.enabled = PGMM：覆蓋層已啟用
pgmm.alert.disconnected = 電網已斷開
pgmm.toast.disconnected = 電網已斷開：已在小地圖標示重新連接提示
pgmm.toast.rescue = 電力不足：已標示救援提示
pgmm.toast.rescueImpact = 電力不足：已標示建議的反應爐
pgmm.mark.reconnect = 重新連接點
pgmm.mark.rescue = 電力救援
pgmm.rescue.text = 電力不足：已標示建議的正電力孤島。
pgmm.rescue.textImpact = 電力不足：已標示建議停用的衝擊反應爐。

setting.pgmm.powertable.section = 電力表
setting.pgmm-power-table.name = 顯示電力表
setting.pgmm-power-table.description = 為大型電網顯示 HUD 電力表。
setting.pgmm-power-table-threshold.name = 電力表閾值
setting.pgmm-power-table-threshold.description = 僅顯示每秒電力輸入高於此數值的電網。
setting.pgmm-power-table-bgalpha.name = 電力表背景透明度
setting.pgmm-power-table-bgalpha.description = 電力表背景的透明度（0-100%）。
pgmm.powertable.title = 電力
pgmm.powertable.empty = 沒有電網。
pgmm.powertable.none = 沒有高於閾值的電網。

