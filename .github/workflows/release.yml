name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # android-actions/setup-android@v3 fails while the legacy "tools" package is gone;
      # the runner image already ships the SDK and cmdline-tools, so install the packages
      # we need straight from ANDROID_SDK_ROOT instead.
      - name: Install Android build-tools
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$sdk_root" ]; then
            echo "No Android SDK found on the runner" >&2
            exit 1
          fi
          sdkmanager="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager" ]; then
            sdkmanager="$(find "$sdk_root/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | sort | tail -n1)"
          fi
          if [ -z "$sdkmanager" ]; then
            echo "sdkmanager not found under $sdk_root" >&2
            exit 1
          fi
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build merged artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          gradle_cmd="gradle"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            gradle_cmd="./gradlew"
          fi
          $gradle_cmd --no-daemon clean deploy

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: false
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.jar
            dist/*.zip
